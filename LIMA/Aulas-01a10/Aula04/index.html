<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Icone favorito - o que fica em cima-->
    <link rel="shortcut icon" href="Imagens/IconePagina.png" type="image/x-icon">

    <title>Favicons e imagens</title>
</head>
<body>
    <h1>Imagens do google</h1>
    <h2>Spider Man</h2>
    <div>
        <!-- Tag para acrescentar imagens - img -->
        <img src="Imagens/ImagemSpiderMan.png" alt="O filme que parou os cinemas!" title="Spider Man - O filme que parou os cinemas">
    </div>
    

    <h2>Spider Man - com proporção de imagens</h2>
    <div>  
        <img src="Imagens/ImagemSpiderMan.jpg" 
        alt="O filme que parou os cinemas!"
        title="Spider Man - O filme que parou os cinemas"
        width="1000px"
        height="600px">
    </div>

    <h2>Spider Man - com proporção de imagens com style</h2>
    <div>
        <img src="Imagens/ImagemSpiderMan.png" 
        alt="O filme que parou os cinemas!"
        title="Spider Man - O filme que parou os cinemas"
        style="margin: 20px;
        background-image: url(Imagens/ImagemSpiderMan.png);
        background-size: cover;
        background-repeat: repeat-x;
        width: 100px;
        height: 200px;"
        >

    </div>
  






</body>
</html>

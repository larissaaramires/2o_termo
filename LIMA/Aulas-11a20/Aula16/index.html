<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <title>Toy Story</title>
</head>
<body>
    <h1 class="p-4 bg-dark text-white">Personagens</h1>
    <section id="Carousel-Personagens" class="carousel slide m-4 p-4" data-bs-ride="carousel">
        <article class="carousel-inner">
            <aside class="carousel-item active" data-bs-interval="6000">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTR3aDRe4Nom1aU1v0AHBNdMY76LGY27nnWv9vOUwfoSWqSPF5CdWNh-SjC&s=10" class="d-block w-100" alt="Woody">
            </aside>
            <aside class="carousel-item" data-bs-interval="6000">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQX97Xbol65G3BcdDWtoL_GGYgXM6UCNNKEYBWJ7fE66PuWMd52oYpM8VQZ&s=10" class="d-block w-100" alt="Buzz Lightyear">
            </aside>
            <aside class="carousel-item" data-bs-interval="6000">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSMzTEDRpM6IMMBL_1WHWwMOt4LNN5wFEk5Z-qjFJUHwRiv4W4Z8VjyBMau&s=10" class="d-block w-100" alt="Cabeça de Batata">
            </aside>
        </article>
    </section>

    <br>
    <h1 class="p-4 bg-dark text-white">Badges</h1>
    <h2 class="m-4">Woody</h2>
    <p class="m-4">
        Woody  <span class="badge text-bg-success">Xerife</span>
    </p>

    <h2 class="m-4">Buzz</h2>
    <p class="m-4">
        Buzz  <span class="badge text-bg-warning">Patrulheiro Espacial</span>
    </p>

    <h2 class="m-4">Sr. Cabeça de Batata</h2>
    <p class="m-4">
        Cabeça de Batata  <span class="badge text-bg-danger">Batata</span>
    </p>
    
    <br>
    <h1 class="p-4 bg-dark text-white">Alertas</h1>
    <br>
    <section class="m=4 alert alert-success" role="alert">
        Woody - Patrulheiro Espacial - Planeta de BuzzPlanet
    </section>

    <section class="m=4 alert alert-warning" role="alertdialog">
        Buzz - Xerife Local do Pizza Planet
    </section>

    <section class="m=4 alert alert-danger" role="alert">
        Sr. Cabeça de Batata - Parceiro do Woody
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>

</body>
</html>
